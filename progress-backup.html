<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Save your Hastings learning progress</title><style>body{font:17px/1.6 system-ui;max-width:600px;margin:40px auto;padding:24px;color:#182b32;background:#f6f7f3}button{font:inherit;padding:18px 24px;min-height:48px;border:0;border-radius:12px;background:#254fdb;color:white}p{overflow-wrap:anywhere}</style><h1>Save your progress</h1><p>This page only reads your learning progress. It does not reset, replace or merge anything.</p><p>Open it in the same browser or Home Screen app that you use to practise. Safari and an installed app may have separate storage.</p><p id="summary" role="status"></p><button id="download" disabled>Download progress backup</button><p><a href="learn.html">Return to the game</a></p><script>
const key='hastingsLearnPrototype.v1',button=document.getElementById('download'),summary=document.getElementById('summary');let raw;
try{raw=localStorage.getItem(key);if(raw){try{const s=JSON.parse(raw);summary.textContent='Found '+Object.keys(s.stats||{}).length+' practised locations and '+(s.completed||0)+' completed lessons at '+location.origin+'.';}catch(_){summary.textContent='Saved data found. Download it unchanged for recovery.';}button.disabled=false;}else summary.textContent='No saved progress found in this browser storage. Nothing has been changed. Check the browser or Home Screen app you normally use.';}catch(_){summary.textContent='Browser storage is unavailable. Nothing has been changed.';}
button.onclick=()=>{const blob=new Blob([JSON.stringify({format:'hastings-learning-backup',version:1,origin:location.origin,path:location.pathname,exportedAt:new Date().toISOString(),storageKey:key,rawProgress:raw},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Hastings-progress-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);};
</script></html>
